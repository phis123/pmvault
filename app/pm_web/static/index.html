<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号密码管理</title>
<style>
/* ===================== 基础与变量 ===================== */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel-2: #f7f9fc;
  --border: #d7dde7;
  --border-soft: #e6ebf2;
  --text: #1d2733;
  --muted: #6b7889;
  --accent: #2f6fed;
  --accent-dark: #245bd0;
  --accent-soft: #e8f0ff;
  --danger: #c8342f;
  --danger-soft: #fdeceb;
  --warn: #b4761a;
  --warn-soft: #fdf3e2;
  --ok: #1f8a4c;
  --radius: 10px;
  --shadow: 0 12px 32px rgba(20, 32, 52, .16);
  --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  min-width: 1000px;
  overflow: hidden;
}
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); }

/* ===================== 通用控件 ===================== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; color: var(--text);
  white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--panel-2); border-color: #c3ccda; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-danger { color: var(--danger); border-color: #eec3c1; }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 4px 8px; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }

input[type="text"], input[type="password"], input[type="number"], textarea, select {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,111,237,.14); }
textarea { resize: vertical; font-family: inherit; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 6px; word-break: break-word; }
.ok-text { color: var(--ok); font-size: 13px; }
.mono { font-family: var(--mono); }
.inline-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }

/* 小标记 */
.mark { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; line-height: 17px; border: 1px solid transparent; }
.mark-weak { background: var(--danger-soft); color: var(--danger); border-color: #f0c9c7; }
.mark-dup { background: var(--warn-soft); color: var(--warn); border-color: #eed9b0; }
.mark-old { background: #eef0f4; color: #5c6879; border-color: #dde2ea; }

/* ===================== 锁屏页 ===================== */
#lock-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #e9eefb 0%, #eef1f6 45%, #e7ecf7 100%);
  overflow: auto;
}
.lock-card {
  width: 420px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; box-shadow: var(--shadow);
}
.lock-card h1 { font-size: 22px; letter-spacing: .5px; }
.lock-card .subtitle { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 64px; }
.pw-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--accent); font-size: 13px; padding: 4px 6px;
}
.lock-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.lock-actions .btn { justify-content: center; }
.lock-foot { margin-top: 18px; border-top: 1px dashed var(--border-soft); padding-top: 12px; }
#recovery-panel { margin-top: 10px; }
#recovery-panel input { font-family: var(--mono); letter-spacing: 1px; }
#unlock-cooldown { margin-top: 8px; font-size: 13px; color: var(--warn); min-height: 20px; }

/* ===================== 主界面 ===================== */
#vault-view { height: 100vh; display: grid; grid-template-rows: 56px minmax(0, 1fr) 28px; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.brand { font-size: 15px; font-weight: 600; letter-spacing: .5px; margin-right: 4px; white-space: nowrap; }
.topbar .search { flex: 1 1 auto; max-width: 460px; position: relative; }
.topbar .search input { padding-left: 30px; }
.topbar .search::before {
  content: "\2315"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 16px;
}
.main { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 0; }
.list-pane {
  border-right: 1px solid var(--border); background: var(--panel);
  display: grid; grid-template-rows: minmax(0, 1fr) 30px; min-height: 0;
}
#entry-list { list-style: none; margin: 0; padding: 0; overflow: auto; }
.entry-item { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.entry-item:hover { background: var(--panel-2); }
.entry-item.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.entry-item .name { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-item .line2 { display: flex; align-items: center; gap: 6px; margin-top: 2px; min-width: 0; }
.entry-item .user { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-item .marks { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tag { background: #eef1f6; border: 1px solid #e0e6ef; color: #55637a; border-radius: 999px; font-size: 11px; padding: 0 7px; }
.list-foot, .statusbar {
  display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted);
  padding: 0 12px; border-top: 1px solid var(--border-soft); background: var(--panel-2);
}
.statusbar { border-top: 1px solid var(--border); background: var(--panel); }
.statusbar .sep { color: #c8d0dc; }
.statusbar .warn-num { color: var(--danger); }

.detail-pane { min-height: 0; overflow: auto; padding: 18px 22px 26px; background: var(--bg); }
.empty-state {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); gap: 8px; text-align: center;
}
.empty-state .big { font-size: 34px; }
.detail-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.detail-head h2 { font-size: 19px; word-break: break-word; }
.detail-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.detail-block { margin-top: 16px; }
.detail-block > .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.copy-row { display: flex; align-items: center; gap: 8px; }
.copy-row .val { flex: 1 1 auto; min-width: 0; word-break: break-all; }
.copy-row .val.masked { font-family: var(--mono); letter-spacing: 2px; }
.url-link { color: var(--accent); text-decoration: none; word-break: break-all; }
.url-link:hover { text-decoration: underline; }
.notes-box {
  white-space: pre-wrap; word-break: break-word; background: var(--panel-2);
  border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto;
}
.strength-row { display: flex; align-items: center; gap: 10px; }
.strength-bar { flex: 1 1 auto; height: 8px; border-radius: 999px; background: #e6eaf1; overflow: hidden; }
.strength-bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .2s; }
.strength-note { font-size: 12px; color: var(--muted); white-space: nowrap; }
.cf-list { display: flex; flex-direction: column; gap: 8px; }

/* ===================== 弹窗 ===================== */
dialog {
  border: none; border-radius: 12px; padding: 0; box-shadow: var(--shadow);
  max-width: 92vw; max-height: 88vh; color: var(--text); background: var(--panel);
}
dialog::backdrop { background: rgba(18, 26, 40, .45); }
.dlg-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--panel); border-radius: 12px 12px 0 0;
}
.dlg-head h3 { font-size: 16px; }
.dlg-head .close {
  margin-left: auto; border: none; background: transparent; font-size: 20px; line-height: 1;
  color: var(--muted); padding: 2px 6px; border-radius: 6px;
}
.dlg-head .close:hover { background: var(--panel-2); color: var(--text); }
.dlg-body { padding: 16px 18px; overflow: auto; max-height: calc(88vh - 120px); }
.dlg-foot {
  display: flex; align-items: center; gap: 8px; padding: 12px 18px;
  border-top: 1px solid var(--border-soft); background: var(--panel-2); border-radius: 0 0 12px 12px;
}
.dlg-foot .spacer { flex: 1 1 auto; }
#dlg-entry { width: 620px; }
#dlg-generator { width: 420px; }
#dlg-sync { width: 640px; }
#dlg-settings { width: 480px; }
#dlg-recovery { width: 560px; }

.gen-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.gen-row > span:first-child { width: 46px; color: var(--muted); font-size: 13px; }
.gen-len-value { width: 34px; text-align: right; font-family: var(--mono); }
.gen-preview {
  font-family: var(--mono); font-size: 15px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px; word-break: break-all; min-height: 42px;
}
.checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 12px 0; }

.cf-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.cf-row .cf-hide { white-space: nowrap; font-size: 12px; color: var(--muted); }

.recovery-box {
  font-family: var(--mono); font-size: 24px; letter-spacing: 2px; text-align: center;
  background: var(--panel-2); border: 1px dashed var(--accent); border-radius: 10px;
  padding: 18px 10px; margin: 10px 0 14px; word-break: break-all; user-select: all;
}
.warn-box {
  background: var(--warn-soft); border: 1px solid #eed9b0; color: #7c5511;
  border-radius: 8px; padding: 10px 12px; font-size: 13px;
}
.info-box { background: var(--accent-soft); border: 1px solid #c9dbfb; color: #234a9a; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
#sync-output { font-family: var(--mono); font-size: 12px; min-height: 96px; }
#sync-input { font-family: var(--mono); font-size: 12px; min-height: 96px; }
.sync-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin: 10px 0; }
.sync-preview { max-height: 180px; overflow: auto; border: 1px solid var(--border-soft); border-radius: 8px; }
.sync-preview .row-item { padding: 6px 10px; border-bottom: 1px solid var(--border-soft); display: flex; gap: 8px; align-items: center; }
.sync-preview .row-item:last-child { border-bottom: none; }

/* ===================== 提示条 ===================== */
#toast-wrap {
  position: fixed; right: 18px; bottom: 18px; z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none;
}
.toast {
  background: #22303f; color: #fff; border-radius: 8px; padding: 9px 14px; font-size: 13px;
  box-shadow: 0 8px 22px rgba(15, 25, 40, .3); max-width: 380px; opacity: .97;
}
.toast.err { background: #a52c27; }
.toast.ok { background: #1c6f42; }
.toast.warn { background: #8a5c12; }
</style>
</head>
<body>

<!-- ===================== A. 锁屏页 ===================== -->
<section id="lock-screen">
  <div class="lock-card">
    <h1>账号密码管理</h1>
    <div class="subtitle" id="lock-subtitle">请输入主密码以解锁本地保险库</div>

    <div class="field">
      <label for="master-password">主密码</label>
      <div class="pw-wrap">
        <input id="master-password" type="password" autocomplete="current-password" placeholder="主密码">
        <button class="pw-toggle" id="toggle-master" type="button">显示</button>
      </div>
    </div>

    <div class="lock-actions">
      <button class="btn btn-primary" id="btn-unlock" type="button">解锁</button>
    </div>

    <div class="err" id="unlock-error"></div>
    <div id="unlock-cooldown"></div>

    <div class="lock-foot">
      <button class="btn btn-ghost" id="btn-show-recovery" type="button">用恢复密钥解锁</button>
      <div id="recovery-panel" class="hidden">
        <div class="field" style="margin-top:8px">
          <label for="recovery-key">恢复密钥</label>
          <input id="recovery-key" type="text" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH-IJKL-MNOP">
        </div>
        <button class="btn" id="btn-recovery-unlock" type="button">用恢复密钥解锁</button>
      </div>
      <div class="hint" id="vault-path-hint" style="margin-top:10px"></div>
    </div>
  </div>
</section>

<!-- ===================== C. 主界面 ===================== -->
<section id="vault-view" class="hidden">
  <header class="topbar">
    <div class="brand">账号密码管理</div>
    <div class="search">
      <input id="search" type="text" placeholder="搜索名称 / 用户名 / 网址 / 标签 / 备注（Ctrl+F）" autocomplete="off">
    </div>
    <div class="grow"></div>
    <button class="btn btn-primary" id="btn-new" type="button">+ 新增</button>
    <button class="btn" id="btn-sync" type="button">加密同步</button>
    <button class="btn" id="btn-settings" type="button">设置</button>
    <button class="btn" id="btn-lock" type="button">锁定</button>
  </header>

  <div class="main">
    <div class="list-pane">
      <ul id="entry-list"></ul>
      <div class="list-foot"><span id="list-summary">&mdash;</span></div>
    </div>
    <div class="detail-pane" id="detail-pane"></div>
  </div>

  <footer class="statusbar">
    <span id="st-count">条目数 &mdash;</span><span class="sep">|</span>
    <span id="st-revision">版本 &mdash;</span><span class="sep">|</span>
    <span id="st-kdf">KDF &mdash;</span><span class="sep">|</span>
    <span id="st-weak">弱密码 &mdash;</span><span class="sep">|</span>
    <span id="st-old">过期 &mdash;</span>
  </footer>
</section>

<!-- 提示条容器 -->
<div id="toast-wrap"></div>

<!-- ===================== 新增 / 编辑弹窗 ===================== -->
<dialog id="dlg-entry" aria-labelledby="entry-dlg-title">
  <form method="dialog" id="entry-form">
    <div class="dlg-head">
      <h3 id="entry-dlg-title">新增条目</h3>
      <button class="close" type="button" data-close="dlg-entry" title="关闭（Esc）">&times;</button>
    </div>
    <div class="dlg-body">
      <div class="field">
        <label for="f-name">名称（必填）</label>
        <input id="f-name" type="text" autocomplete="off" placeholder="例如：公司邮箱">
      </div>
      <div class="field">
        <label for="f-username">用户名</label>
        <input id="f-username" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="f-password">密码</label>
        <div class="row">
          <input id="f-password" type="text" class="grow mono" autocomplete="off" spellcheck="false" placeholder="留空表示不修改密码（编辑时）">
          <button class="btn" id="btn-open-generator" type="button">生成</button>
        </div>
        <div class="hint" id="f-password-hint"></div>
      </div>
      <div class="field">
        <label for="f-url">网址</label>
        <input id="f-url" type="text" autocomplete="off" spellcheck="false" placeholder="https://example.com">
      </div>
      <div class="field">
        <label for="f-tags">标签（用逗号分隔）</label>
        <input id="f-tags" type="text" autocomplete="off" placeholder="工作, 邮箱">
      </div>
      <div class="field">
        <label for="f-notes">备注</label>
        <textarea id="f-notes" rows="3" placeholder="可选"></textarea>
      </div>
      <div class="field">
        <label>自定义字段</label>
        <div id="custom-fields"></div>
        <button class="btn btn-sm" id="btn-add-field" type="button">+ 添加字段</button>
      </div>
      <div class="err" id="entry-error"></div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button class="btn" type="button" data-close="dlg-entry">取消</button>
      <button class="btn btn-primary" id="btn-save-entry" type="submit">保存</button>
    </div>
  </form>
</dialog>

<!-- ===================== 密码生成器弹窗 ===================== -->
<dialog id="dlg-generator" aria-labelledby="gen-title">
  <form method="dialog">
    <div class="dlg-head">
      <h3 id="gen-title">密码生成器</h3>
      <button class="close" type="button" data-close="dlg-generator" title="关闭（Esc）">&times;</button>
    </div>
    <div class="dlg-body">
      <div class="gen-row">
        <span>长度</span>
        <input id="gen-length" type="range" min="6" max="64" step="1" value="20">
        <span class="gen-len-value" id="gen-length-value">20</span>
      </div>
      <div class="checkbox-grid">
        <label class="inline-check"><input type="checkbox" id="gen-lower" checked>小写字母 a-z</label>
        <label class="inline-check"><input type="checkbox" id="gen-upper" checked>大写字母 A-Z</label>
        <label class="inline-check"><input type="checkbox" id="gen-digits" checked>数字 0-9</label>
        <label class="inline-check"><input type="checkbox" id="gen-symbols" checked>符号 !@#$</label>
        <label class="inline-check"><input type="checkbox" id="gen-exclude">排除易混字符</label>
      </div>
      <div class="field">
        <label>预览</label>
        <div class="gen-preview" id="gen-preview">&mdash;</div>
      </div>
      <div class="row">
        <button class="btn" id="btn-gen-refresh" type="button">重新生成</button>
        <span class="hint" id="gen-strength"></span>
      </div>
      <div class="err" id="gen-error"></div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button class="btn" type="button" data-close="dlg-generator">取消</button>
      <button class="btn btn-primary" id="btn-gen-use" type="submit">使用此密码</button>
    </div>
  </form>
</dialog>

<!-- ===================== 同步弹窗 ===================== -->
<dialog id="dlg-sync" aria-labelledby="sync-title">
  <form onsubmit="return false">
    <div class="dlg-head">
      <h3 id="sync-title">加密同步</h3>
      <button class="close" type="button" data-close="dlg-sync" title="关闭（Esc）">&times;</button>
    </div>
    <div class="dlg-body">
      <div class="sync-meta" id="sync-estimate"></div>

      <div class="field">
        <label for="sync-passphrase">同步口令（至少 8 位，两端必须一致）</label>
        <div class="row">
          <input id="sync-passphrase" type="password" class="grow" autocomplete="new-password">
          <button class="btn" id="btn-toggle-sync-pass" type="button">显示</button>
        </div>
      </div>

      <div class="field">
        <label>导出：生成本机加密字符串</label>
        <div class="row" style="margin-bottom:6px">
          <button class="btn" id="btn-sync-pack" type="button">生成上传字符串</button>
          <span class="hint" id="sync-pack-hint"></span>
        </div>
        <textarea id="sync-output" readonly rows="5" placeholder="生成结果会出现在这里"></textarea>
        <div class="row" style="margin-top:6px">
          <button class="btn btn-sm" id="btn-sync-copy" type="button">复制全部</button>
        </div>
      </div>

      <div class="field">
        <label for="sync-input">导入：粘贴其它设备生成的字符串</label>
        <textarea id="sync-input" rows="5" placeholder="PM1-... 每行一个分片，请全部粘贴进来" spellcheck="false"></textarea>
        <div class="row" style="margin-top:6px">
          <button class="btn" id="btn-sync-preview" type="button">解析预览</button>
          <button class="btn btn-primary hidden" id="btn-sync-apply" type="button">应用到本机</button>
        </div>
        <div id="sync-preview-box" class="hidden" style="margin-top:10px">
          <div class="sync-meta" id="sync-preview-meta"></div>
          <div class="sync-preview" id="sync-preview-list"></div>
          <div class="info-box hidden" id="sync-conflict-hint" style="margin-top:8px"></div>
        </div>
        <div class="err" id="sync-error"></div>
      </div>

      <hr style="border:none;border-top:1px solid var(--border-soft);margin:14px 0">
      <div class="field">
        <label>恢复密钥</label>
        <button class="btn btn-sm" id="btn-rotate-recovery" type="button">生成新的恢复密钥</button>
        <span class="hint">旧密钥会立即失效</span>
      </div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button class="btn" type="button" data-close="dlg-sync">关闭</button>
    </div>
  </form>
</dialog>

<!-- ===================== 设置弹窗 ===================== -->
<dialog id="dlg-settings" aria-labelledby="settings-title">
  <form onsubmit="return false">
    <div class="dlg-head">
      <h3 id="settings-title">设置</h3>
      <button class="close" type="button" data-close="dlg-settings" title="关闭（Esc）">&times;</button>
    </div>
    <div class="dlg-body">
      <div class="grid-2">
        <div class="field">
          <label for="s-autolock">自动锁定（分钟，0 = 不自动锁定）</label>
          <input id="s-autolock" type="number" min="0" max="240" step="1">
        </div>
        <div class="field">
          <label for="s-clipboard">剪贴板清空（秒）</label>
          <input id="s-clipboard" type="number" min="0" max="600" step="1">
        </div>
        <div class="field">
          <label for="s-reveal">密码回掩（秒）</label>
          <input id="s-reveal" type="number" min="0" max="600" step="1">
        </div>
        <div class="field">
          <label for="s-olddays">密码过期提醒（天）</label>
          <input id="s-olddays" type="number" min="1" max="3650" step="1">
        </div>
      </div>

      <hr style="border:none;border-top:1px solid var(--border-soft);margin:6px 0 14px">
      <div class="field">
        <label>修改主密码</label>
        <div class="row">
          <button class="btn btn-sm" id="btn-change-master" type="button">修改主密码</button>
          <span class="hint">修改后会生成新的恢复密钥</span>
        </div>
      </div>
      <div class="field">
        <label for="s-export-path">导出加密副本（绝对路径）</label>
        <div class="row">
          <input id="s-export-path" type="text" class="grow mono" placeholder="D:\backup\vault-backup.pmvault">
          <button class="btn" id="btn-export" type="button">导出</button>
        </div>
      </div>
      <div class="err" id="settings-error"></div>
      <div class="ok-text" id="settings-ok"></div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button class="btn" type="button" data-close="dlg-settings">取消</button>
      <button class="btn btn-primary" id="btn-save-settings" type="button">保存</button>
    </div>
  </form>
</dialog>

<!-- ===================== 恢复密钥强制确认弹窗 ===================== -->
<dialog id="dlg-recovery" aria-labelledby="recovery-dlg-title">
  <form method="dialog">
    <div class="dlg-head">
      <h3 id="recovery-dlg-title">请抄写恢复密钥</h3>
    </div>
    <div class="dlg-body">
      <div class="warn-box" id="recovery-reason">这是恢复密钥，是主密码遗忘时唯一的找回方式，请立即抄写并离线保存。</div>
      <div class="recovery-box" id="recovery-value">&mdash;</div>
      <div class="row" style="margin-bottom:12px">
        <button class="btn btn-sm" id="btn-copy-recovery" type="button">复制</button>
        <span class="hint">不要截图保存在网盘或聊天记录里</span>
      </div>
      <label class="inline-check">
        <input type="checkbox" id="recovery-ack">
        <span>我已抄写并妥善保存</span>
      </label>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btn-recovery-done" type="button" disabled>完成</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
/* 极简兜底：如果后端把静态目录挂在 /static/ 下（而不是站点根目录），
   上面按交付要求写的相对路径 app.js 会 404，这里再补一次 /static/app.js。
   界面本身不依赖任何外部资源。 */
(function () {
  function bootFallback() {
    if (window.PM && typeof window.PM.init === 'function') { return; }
    var s = document.createElement('script');
    s.src = '/static/app.js';
    s.onload = function () {
      if (window.PM && typeof window.PM.init === 'function') { window.PM.init(); }
    };
    document.head.appendChild(s);
  }
  if (document.readyState === 'complete') { window.setTimeout(bootFallback, 0); }
  else { window.addEventListener('load', bootFallback); }
})();
</script>
</body>
</html>
