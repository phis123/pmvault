[project]
name = "pmvault"
version = "2.0.0"
description = "PMVault 双端统一本地加密密码库（Windows 桌面 / Android 手机与平板）：AES-256-GCM + 64MB Scrypt/Argon2id + 本机密钥 + 一次性恢复码 + 双通道互补同步"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "cryptography==48.0.0",
    "segno==1.6.1",
]

[tool.flet]
org = "com.phis123"
product = "PMVault"
company = "phis123"
copyright = "Copyright (c) 2026 phis123"

[tool.flet.app]
path = "app"

[tool.flet.android]
# 只出 64 位 ARM（arm64-v8a），显著减小 APK 体积；包名保持 com.phis123.pmvault 支持覆盖升级
split_per_abi = true
