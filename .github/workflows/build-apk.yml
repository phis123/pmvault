name: Build Android APK

# 在 GitHub 的机器上构建签名 APK。
#
# 关键点：flet build 在缺 Flutter/JDK/Android SDK 时会**交互式询问 y/n**，
# CI 里没有标准输入会直接 EOFError 失败。所以这里先把三样都装到它认的位置：
#   - JDK 17       → JAVA_HOME（Flet 认 JAVA_HOME，且要求主版本 17）
#   - Flutter      → ~/flutter/3.44.8（Flet 写死找这个目录）
#   - Android SDK  → ANDROID_HOME 下的 cmdline-tools/latest/bin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - ".github/workflows/build-apk.yml"

env:
  FLUTTER_VERSION: "3.44.8"
  JDK_DIR: "17.0.13+11"
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------------- 缓存
      - name: 缓存 Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter/${{ env.FLUTTER_VERSION }}
          key: flutter-${{ env.FLUTTER_VERSION }}

      - name: 缓存 JDK
        uses: actions/cache@v4
        with:
          path: ~/java/${{ env.JDK_DIR }}
          key: jdk-${{ env.JDK_DIR }}

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-v1

      # ---------------------------------------------------------------- 依赖
      - name: 安装 Flutter SDK
        run: |
          DIR="$HOME/flutter/$FLUTTER_VERSION"
          if [ -x "$DIR/bin/flutter" ]; then
            echo "Flutter 已缓存，跳过安装"
          else
            mkdir -p "$HOME/flutter"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "下载 $URL"
            curl -fL --retry 3 -o /tmp/flutter.tar.xz "$URL"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME/flutter"
            mv "$HOME/flutter/flutter" "$DIR"
            rm -f /tmp/flutter.tar.xz
          fi
          "$DIR/bin/flutter" --version

      - name: 安装 JDK 17
        run: |
          DIR="$HOME/java/$JDK_DIR"
          if [ -x "$DIR/bin/javac" ]; then
            echo "JDK 已缓存，跳过安装"
          else
            mkdir -p "$HOME/java"
            URL="https://api.adoptium.net/v3/binary/version/jdk-${JDK_DIR//+/%2B}/linux/x64/jdk/hotspot/normal/eclipse"
            echo "下载 $URL"
            curl -fL --retry 3 -o /tmp/jdk.tar.gz "$URL"
            mkdir -p /tmp/jdkx
            tar -xzf /tmp/jdk.tar.gz -C /tmp/jdkx
            inner=$(ls /tmp/jdkx | head -1)
            mv "/tmp/jdkx/$inner" "$DIR"
            rm -rf /tmp/jdk.tar.gz /tmp/jdkx
          fi
          export JAVA_HOME="$DIR"
          "$DIR/bin/javac" -version

      - name: 安装 Android SDK（含 Flet 要求的基础包）
        run: |
          export JAVA_HOME="$HOME/java/$JDK_DIR"
          export PATH="$JAVA_HOME/bin:$PATH"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fL --retry 3 -o /tmp/cmdline.zip "$URL"
            unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -f /tmp/cmdline.zip
          fi
          # Flet 会检查这几个目录是否存在，缺一个就判定 SDK 不完整并弹交互提示
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          echo "--- 校验 Flet 要求的路径 ---"
          for p in cmdline-tools/latest/bin/sdkmanager platform-tools "platforms/android-35" "build-tools/34.0.0"; do
            if [ -e "$ANDROID_HOME/$p" ]; then echo "  OK   $p"; else echo "  缺失 $p"; exit 1; fi
          done

      - name: 装 Flet CLI 与依赖
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.0.4" cryptography==48.0.0

      - name: 自检：加密内核与界面能否导入
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: |
          python -c "import pm_core, pm_android; print('导入 OK:', pm_android.APP_TITLE)"
          python -c "import os,tempfile;from pm_core import Vault,Credential;d=tempfile.mkdtemp();p=os.path.join(d,'v.pmvault');v=Vault.create(p,'Selftest-1!Strong');v.add(Credential(name='GitHub',username='alice',password='pw-1'));v2=Vault.unlock(p,'Selftest-1!Strong');raw=open(p,'rb').read();assert v2.all()[0].password=='pw-1';assert b'GitHub' not in raw and b'pw-1' not in raw;print('核心层自检通过：加解密往返正常、磁盘无明文')"

      - name: 预检：确认 Flet 不会再弹交互提示
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: python "${{ github.workspace }}/app/pm_android/precheck_ci.py"

      - name: 还原签名密钥（从 Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将使用调试签名（能装但不适合长期升级）"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
            ls -l upload-keystore.p12
          fi

      - name: 构建 APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/upload-keystore.p12
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export JAVA_HOME="$HOME/java/$JDK_DIR"
          export PATH="$HOME/flutter/$FLUTTER_VERSION/bin:$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "flutter=$(command -v flutter)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f upload-keystore.p12 ]; then
            unset FLET_ANDROID_SIGNING_KEY_STORE FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD \
                  FLET_ANDROID_SIGNING_KEY_PASSWORD FLET_ANDROID_SIGNING_KEY_ALIAS
          fi
          # 把完整输出同时写进文件（GitHub 的日志收集在本仓库拿不到，改用 artifact 传日志）
          set -o pipefail
          mkdir -p diagnose
          flet build apk --verbose 2>&1 | tee diagnose/build.log

      - name: 构建失败时收集环境诊断
        if: failure()
        run: |
          mkdir -p diagnose
          {
            echo "=== 环境 ==="
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            env | grep -E '^(FLET|JAVA|ANDROID|PATH)=' | sed 's/=.*KEY.*/=***/' || true
            echo
            echo "=== java ==="; "$HOME/java/$JDK_DIR/bin/java" -version 2>&1 || true
            echo "=== flutter ==="; "$HOME/flutter/$FLUTTER_VERSION/bin/flutter" --version 2>&1 || true
            echo "=== sdkmanager 包列表 ==="
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | head -40 || true
            echo
            echo "=== flet 版本 ==="; flet --version 2>&1 || true
            echo "=== python 包 ==="; pip list 2>&1 | grep -Ei 'flet|crypt|cffi|pyinstaller' || true
            echo
            echo "=== 仓库文件 ==="; find . -maxdepth 3 -not -path './.git/*' -not -path './diagnose/*' | sort | head -60
          } > diagnose/env.log 2>&1
          tail -100 diagnose/env.log

      - name: 上传诊断日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnose/
          if-no-files-found: warn
          retention-days: 14

      - name: 列出产物
        if: success()
        run: find build -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmvault-apk
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
