name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "installer/pmvault.iss"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.0.4" cryptography==48.0.0 segno==1.6.1 pytest
      - name: 跑全量测试
        run: python tests/run_all.py
      - name: 构建 Flet Windows 桌面版
        run: flet build windows --verbose
      - name: 打免安装压缩包与 Inno Setup 安装包
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\*" -DestinationPath "dist\PMVault-$ver-windows-portable.zip" -Force
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc installer/pmvault.iss "/DAppVersion=$ver" "/DSourceDir=..\build\windows" "/DOutputDir=..\dist"
          Get-ChildItem dist
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: pmvault-windows
          path: dist/*
          retention-days: 30
