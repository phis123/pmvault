name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "installer/pmvault.iss"
      - ".github/workflows/build-windows.yml"

env:
  FLUTTER_VERSION: "3.44.8"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter/${{ env.FLUTTER_VERSION }}
          key: flutter-win-${{ env.FLUTTER_VERSION }}

      - name: 安装 Flutter SDK（避免 flet build 弹交互提示）
        shell: pwsh
        run: |
          $dir = Join-Path $HOME "flutter\$env:FLUTTER_VERSION"
          if (-not (Test-Path (Join-Path $dir "bin\flutter.bat"))) {
            New-Item -ItemType Directory -Force -Path (Join-Path $HOME "flutter") | Out-Null
            $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
            Write-Host "Downloading $url"
            curl.exe -fL --retry 3 -o "$env:TEMP\flutter.zip" $url
            Expand-Archive -Path "$env:TEMP\flutter.zip" -DestinationPath "$env:TEMP\flutter_x" -Force
            Move-Item "$env:TEMP\flutter_x\flutter" $dir
            Remove-Item "$env:TEMP\flutter.zip", "$env:TEMP\flutter_x" -Recurse -Force
          }
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\bin\flutter.bat" --version

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.0.4" cryptography==48.0.0 segno==1.6.1 pytest

      - name: 跑全量测试
        run: python tests/run_all.py

      - name: 构建 Flet Windows 桌面版
        shell: pwsh
        run: |
          flet build windows --verbose

      - name: 打免安装压缩包与 Inno Setup 安装包
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\*" -DestinationPath "dist\PMVault-$ver-windows-portable.zip" -Force
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc installer/pmvault.iss "/DAppVersion=$ver" "/DSourceDir=..\build\windows" "/DOutputDir=..\dist"
          Get-ChildItem dist

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: pmvault-windows
          path: dist/*
          retention-days: 30
